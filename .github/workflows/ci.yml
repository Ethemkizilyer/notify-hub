name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: notifyhub
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: notifyhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notifyhub -d notifyhub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://notifyhub:ci-password@localhost:5432/notifyhub_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-test-access-secret-at-least-32-chars
      JWT_REFRESH_SECRET: ci-test-refresh-secret-at-least-32-chars
      WEB_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate -w apps/api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w apps/api
      - run: npm run build -w apps/web

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t notifyhub-api .
      - run: docker build -f apps/web/Dockerfile -t notifyhub-web .
